<section id="location" class="location-section section-pad shell-width">
  <div class="location-photo photo-frame">
    <img [src]="content.photos.location" alt="Exterior location photo for Gamers Nest in Ayappakkam" loading="lazy" />
    <span class="photo-tag">FIND THE NEST / 01</span>
  </div>
  <div class="location-copy">
    <app-section-label
      eyebrow="AYAPPAKKAM / CHENNAI"
      title="FIND THE NEST"
      copy="Your gaming zone in Ayappakkam."
    ></app-section-label>
    <div class="address-block">
      <strong>GAMERS NEST</strong>
      <span>E-Gaming Lounge</span>
      <p>Shop No. 2, First Floor,<br />MIG No. 2165,<br />TNHB, 4th Main Road,<br />Ayappakkam,<br />Chennai – 600077</p>
    </div>
    <div class="contact-rows">
      <a [href]="content.phoneHref"><svg lucidePhone [size]="16"></svg> {{ content.phone }}</a>
      <a [href]="'mailto:' + content.email"><svg lucideArrowUpRight [size]="16"></svg> {{ content.email }}</a>
      <span><svg lucideClock3 [size]="16"></svg> {{ content.hours }}</span>
    </div>
    <div class="location-actions">
      <a [href]="content.directionsLink" target="_blank" rel="noreferrer" class="button button-primary">GET DIRECTIONS <svg lucideArrowUpRight [size]="16"></svg></a>
      <a [href]="content.phoneHref" class="button button-ghost">CALL NOW <svg lucidePhone [size]="16"></svg></a>
      <a [href]="content.whatsappLink" target="_blank" rel="noreferrer" class="button button-ghost">WHATSAPP <svg lucideMessageCircle [size]="16"></svg></a>
    </div>
  </div>
</section>
