<header class="site-nav" [class.site-nav-scrolled]="scrolled()">
  <a href="#home" class="brand-lockup" (click)="closeMenu()" aria-label="Gamers Nest home">
    <img [src]="content.logoMark" alt="" class="brand-mark" />
    <span class="brand-wordmark"><strong>GAMERS</strong><em>NEST</em></span>
  </a>
  <nav class="nav-links" [class.nav-links-open]="mobileOpen()" aria-label="Primary navigation">
    @for (link of content.navLinks; track link[1]) {
      <a [href]="'#' + link[1]" (click)="closeMenu()">{{ link[0] }}</a>
    }
    <button class="nav-book mobile-nav-book" (click)="chooseExperience('')">
      BOOK NOW <svg lucideArrowUpRight [size]="15"></svg>
    </button>
  </nav>
  <button class="nav-book desktop-nav-book" (click)="chooseExperience('')">
    BOOK NOW <svg lucideArrowUpRight [size]="15"></svg>
  </button>
  <button
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="mobileOpen()"
    [attr.aria-label]="mobileOpen() ? 'Close menu' : 'Open menu'"
  >
    @if (mobileOpen()) {
      <svg lucideX [size]="23"></svg>
    } @else {
      <svg lucideMenu [size]="23"></svg>
    }
  </button>
</header>
