<section class="intro-section section-pad shell-width">
  <div class="intro-copy reveal-up">
    <app-section-label eyebrow="THE NEST" title="WELCOME TO THE NEST"></app-section-label>
    <p class="intro-lead">A place where gamers come to play, compete, race and experience their favourite games with friends.</p>
    <button class="text-link" (click)="scrollToId('experiences')">
      SEE THE EXPERIENCES <svg lucideArrowUpRight [size]="15"></svg>
    </button>
  </div>
  <div class="intro-photo photo-frame reveal-up">
    <img [src]="content.photos.one" alt="Real gaming interior at Gamers Nest" loading="lazy" />
    <span class="photo-tag">01 / THE SPACE</span>
  </div>
</section>
