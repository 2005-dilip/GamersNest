<footer class="site-footer">
  <div class="shell-width footer-top">
    <div class="footer-brand">
      <a href="#home" class="brand-lockup">
        <img [src]="content.logoMark" alt="" class="brand-mark" />
        <span class="brand-wordmark"><strong>GAMERS</strong><em>NEST</em></span>
      </a>
      <p>Premium E-Gaming Lounge<br />Ayappakkam, Chennai</p>
    </div>
    <div class="footer-col">
      <span class="footer-label">EXPLORE</span>
      <a href="#experiences">Experiences</a>
      <a href="#games">Games</a>
      <a href="#pricing">Pricing</a>
      <a href="#gallery">Gallery</a>
    </div>
    <div class="footer-col">
      <span class="footer-label">CONNECT</span>
      <a href="#reviews">Reviews</a>
      <a href="#location">Location</a>
      <a href="#book">Book Now</a>
      <a [href]="content.instagramLink" target="_blank" rel="noreferrer">Instagram</a>
    </div>
    <div class="footer-col footer-contact">
      <span class="footer-label">CONTACT</span>
      <a [href]="content.phoneHref">{{ content.phone }}</a>
      <a [href]="'mailto:' + content.email">{{ content.email }}</a>
      <span>{{ content.hours }}</span>
    </div>
  </div>
  <div class="shell-width footer-bottom">
    <span>© {{ year }} GAMERS NEST</span>
    <span>PREMIUM E-GAMING LOUNGE / AYAPPAKKAM</span>
    <button (click)="scrollToId('book')">READY TO PLAY? <svg lucideArrowUpRight [size]="15"></svg></button>
  </div>
</footer>
