<section id="home" class="hero-section" [style.backgroundImage]="'url(' + content.photos.hero + ')'">
  <div class="hero-overlay"></div>
  <div class="hero-orb hero-orb-cyan"></div>
  <div class="hero-orb hero-orb-lime"></div>
  <div class="hero-content shell-width">
    <div class="hero-copy reveal-up">
      <span class="hero-kicker"><span class="status-dot"></span> GAMERS NEST / AYAPPAKKAM</span>
      <p class="hero-overline">PREMIUM E-GAMING LOUNGE</p>
      <h1>PLAY.<br /><span>COMPETE.</span><br />CONQUER.</h1>
      <p class="hero-subtitle">Your gaming zone in Ayappakkam.</p>
      <div class="hero-actions">
        <button class="button button-primary" (click)="chooseExperience('')">
          BOOK YOUR SESSION <svg lucideArrowUpRight [size]="17"></svg>
        </button>
        <button class="button button-ghost" (click)="scrollToId('games')">
          EXPLORE GAMES <svg lucidePlay [size]="16" fill="currentColor"></svg>
        </button>
      </div>
      <div class="hero-meta">
        <span><svg lucideMapPin [size]="14"></svg> AYAPPAKKAM, CHENNAI</span>
        <span><svg lucideClock3 [size]="14"></svg> 11:00 AM – 11:00 PM</span>
      </div>
    </div>
    <div class="hero-side-note"><span class="vertical-rule"></span><span>REAL SPACE.<br />REAL PLAY.</span></div>
  </div>
  <div class="hero-bottom-bar shell-width">
    <span>01 / 06</span><span class="hero-line"></span>
    <span>SCROLL TO EXPLORE <svg lucideArrowUpRight [size]="14"></svg></span>
  </div>
</section>
