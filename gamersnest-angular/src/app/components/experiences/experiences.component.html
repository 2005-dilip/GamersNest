<section id="experiences" class="experiences-section section-pad shell-width">
  <app-section-label
    eyebrow="CHOOSE YOUR MODE"
    title="WHAT ARE YOU HERE FOR?"
    copy="One lounge. Five ways to play."
  ></app-section-label>
  <div class="experience-grid">
    @for (experience of content.experiences; track experience.title; let i = $index) {
      <article class="experience-card reveal-up" [class]="'experience-' + (i + 1)">
        <img [src]="experience.photo" [alt]="experience.title.toLowerCase() + ' experience at Gamers Nest'" loading="lazy" />
        <div class="card-tint" [class]="'card-tint-' + experience.tint"></div>
        <div class="experience-index">0{{ i + 1 }}</div>
        <div class="experience-content">
          <span class="card-kicker">{{ experience.price }}</span>
          <h3>{{ experience.title }}</h3>
          <p>{{ experience.description }}</p>
          <button class="card-link" (click)="chooseExperience(experience.formValue)">
            <span>EXPLORE / BOOK</span><svg lucideArrowUpRight [size]="16"></svg>
          </button>
        </div>
      </article>
    }
  </div>
</section>
