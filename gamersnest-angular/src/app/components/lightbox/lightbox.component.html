<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" (click)="close()">
  <button class="lightbox-close" (click)="close()" aria-label="Close photo viewer">
    <svg lucideX></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" (click)="stop($event); prev()" aria-label="Previous photo">
    <svg lucideChevronLeft></svg>
  </button>
  <img [src]="items[index].src" [alt]="items[index].alt" (click)="stop($event)" />
  <button class="lightbox-nav lightbox-next" (click)="stop($event); next()" aria-label="Next photo">
    <svg lucideChevronRight></svg>
  </button>
  <span class="lightbox-count">0{{ index + 1 }} / 0{{ items.length }}</span>
</div>
