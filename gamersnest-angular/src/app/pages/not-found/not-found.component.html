<div class="notfound-screen">
  <div class="notfound-card">
    <div class="notfound-icon-wrap">
      <div class="notfound-icon-pulse"></div>
      <svg lucideCircleAlert class="notfound-alert"></svg>
    </div>

    <h1 class="notfound-code">404</h1>
    <h2 class="notfound-title">Page Not Found</h2>
    <p class="notfound-copy">
      Sorry, the page you are looking for doesn't exist.<br />
      It may have been moved or deleted.
    </p>

    <div class="notfound-actions">
      <button class="notfound-home-btn" (click)="goHome()">
        <svg lucideHouse [size]="16"></svg> Go Home
      </button>
    </div>
  </div>
</div>
